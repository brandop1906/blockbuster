[package]
name = "blockbuster"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.18.0", features = ["bevy_ui", "wav", "mp3"] }
bevy_rapier2d = {version = "0.34.0", features = [ "debug-render-2d"]}
rand = "0.10.2"


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
