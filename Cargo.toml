[package]
name = "blockbuster"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.0"
bevy_rapier2d = {version = "0.34.0", features = [ "debug-render-2d"]}


# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
